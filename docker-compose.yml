services:
  repo-ripper:
    build: .
    container_name: repo-ripper
    restart: unless-stopped
    env_file: .env
    ports:
      - "8019:8019"
    volumes:
      # App database + WAL. Keep this on local disk of the Docker host, not on
      # the NAS (SQLite on SMB/NFS can become corrupt).
      - ./data:/data
      # ONE parent folder for the NAS. Mount the NAS share on the Docker host
      # first (see README, "Quick start"), then give its mount point here.
      #   left side  = folder on the Docker host (change it if yours is different)
      #   right side = folder in the container (keep /mnt/nas)
      # In the setup wizard you browse below /mnt/nas and select the mirror
      # folder and the protection folder. The app does not mount shares itself.
      # For a second share (protection copy on a different NAS or disk), mount
      # it on the host below the same parent, for example /mnt/nas/backup2.
      # The container must be able to write here as uid 1000.
      - /mnt/nas:/mnt/nas
