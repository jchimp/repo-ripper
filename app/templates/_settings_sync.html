<div class="form-section">
  <h2>Sync</h2>
  <div class="field cron">
    <label for="pull_workers">Parallel pulls</label>
    <input type="number" id="pull_workers" name="pull_workers" min="1" max="8" step="1"
           value="{{ pull_workers }}">
  </div>
  <div class="hint">The pull job mirrors this number of repositories at the same time (1 to 8).
    Use a smaller number for a slow NAS or a slow connection.</div>
</div>
