<td id="repo-meta-{{ r.id }}" class="meta-cell">
  <button type="button" class="toggle" data-on="{{ r.metadata_enabled }}"
          aria-pressed="{{ 'true' if r.metadata_enabled else 'false' }}"
          aria-label="Capture metadata for {{ r.full_name }}"
          title="{{ 'On. Pull requests, issues and comments are captured.' if r.metadata_enabled else 'Off. Metadata is not captured.' }}"
          hx-post="/repos/{{ r.id }}/metadata-toggle"
          hx-target="#repo-meta-{{ r.id }}"
          hx-swap="outerHTML"></button>
  {% if r.meta_sync_at %}
  <span class="meta-counts" title="Last metadata sync: {{ r.meta_sync_at | fmt_time }}">
    {{- r.meta_issues or 0 }} issues · {{ r.meta_pulls or 0 }} PRs</span>
  {% if r.meta_status and r.meta_status != 'ok' %}
  <span class="pill {{ 'error' if r.meta_status == 'error' else 'partial' }}"
        title="{{ r.meta_message or '' }}">{{ r.meta_status | replace('_', ' ') }}</span>
  {% endif %}
  <span class="meta-when">{{ r.meta_sync_at | fmt_time }}</span>
  {% elif r.metadata_enabled %}
  <span class="meta-counts">not captured yet</span>
  {% endif %}
</td>
