<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}repo-ripper{% endblock %}</title>
  <meta name="color-scheme" content="dark light">
  <script src="{{ static_url('theme.js') }}"></script>
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <script src="{{ static_url('htmx.min.js') }}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  {% if user %}
  <header class="topbar">
    <a class="wordmark" href="/">repo<span class="sep">·</span>ripper</a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
      <a href="/repos" class="{{ 'active' if active == 'repos' }}">Repositories</a>
      <a href="/jobs" class="{{ 'active' if active == 'jobs' }}">Jobs</a>
      <a href="/storage" class="{{ 'active' if active == 'storage' }}">Storage</a>
      <a href="/settings" class="{{ 'active' if active == 'settings' }}">Settings</a>
    </nav>
    <span class="spacer"></span>
    <span class="who">{{ user }}</span>
    <button type="button" class="theme-toggle" data-theme-toggle
            aria-label="Switch between light and dark theme" title="Light / dark"></button>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="link">Sign out</button>
    </form>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% if user %}<footer class="app-footer">repo-ripper {{ app_version }}</footer>{% endif %}
</body>
</html>
